services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD:?set it in .env}
      GITEA__server__ROOT_URL: https://git.home.${DOMAIN}/
      GITEA__server__SSH_DOMAIN: git.home.${DOMAIN}
      GITEA__server__SSH_PORT: 2222
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3002:3000"
      - "2222:22"
    depends_on:
      gitea-db:
        condition: service_healthy
    networks:
      - proxy
      - internal

  gitea-db:
    image: postgres:17          # pinned major: never jump majors in place
    container_name: gitea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: gitea
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal                # only Gitea can reach the DB

networks:
  proxy:
    external: true
  internal: {}
