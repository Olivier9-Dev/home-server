services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8083:8080"
    volumes:
      - ./config:/etc/searxng
      - ./cache:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: https://search.home.${DOMAIN}/
    networks:
      - proxy

networks:
  proxy:
    external: true
