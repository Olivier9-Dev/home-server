services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # full Docker API = root on the VM. LAN/VPN only.
      - ./data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true
