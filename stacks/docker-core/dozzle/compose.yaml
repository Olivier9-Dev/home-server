services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_HOSTNAME: docker-core
      DOZZLE_REMOTE_AGENT: 192.168.1.21:7007   # agent on docker-apps
    networks:
      - proxy

networks:
  proxy:
    external: true
